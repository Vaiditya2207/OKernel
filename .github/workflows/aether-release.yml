name: Aether Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 0.1.0)'
        required: false # Optional if triggered by tag, or we can fallback
        type: string
      description:
        description: 'Release Description'
        required: false
        type: string
      changelog:
        description: 'Changelog'
        required: false
        type: string
      channel:
        description: 'Release channel (stable/beta/dev)'
        required: false
        type: string
        default: 'stable'
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      # Determine Version
      - name: Set Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
            echo "DESCRIPTION=${{ inputs.description }}" >> $GITHUB_ENV
            echo "CHANGELOG=${{ inputs.changelog }}" >> $GITHUB_ENV
            echo "CHANNEL=${{ inputs.channel }}" >> $GITHUB_ENV
          else
            # Extract from tag v0.3.0 -> 0.3.0
            TAG_NAME=${{ github.ref_name }}
            VERSION=${TAG_NAME#v}
            echo "VERSION=$VERSION" >> $GITHUB_ENV
            echo "DESCRIPTION=Automated Release $VERSION" >> $GITHUB_ENV
            # Get commit message as changelog or leave empty
            echo "CHANGELOG=${{ github.event.head_commit.message }}" >> $GITHUB_ENV
            echo "CHANNEL=stable" >> $GITHUB_ENV
          fi

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install Dependencies
        run: |
            brew install create-dmg bsdiff

      - name: Build Aether
        working-directory: apps/aether
        run: |
          chmod +x build_release.sh
          ./build_release.sh

      - name: Publish to Syscore
        run: |
          DMG_PATH="apps/aether/Aether_Installer.dmg"
          BUNDLE_PATH="apps/aether/Aether-bundle-${VERSION}.tar.gz"
          
          if [ ! -f "$DMG_PATH" ]; then
            echo "Error: DMG file not found at $DMG_PATH"
            exit 1
          fi

          # Create tarball bundle from the built .app
          echo "Creating tarball bundle..."
          tar -czf "$BUNDLE_PATH" -C apps/aether/build_artifact Aether.app

          # Phase 9: Delta Update Generation
          echo "Checking for previous version for delta patch..."
          PREV_VERSION_JSON=$(curl -s "https://api.hackmist.tech/api/v1/aether/latest?channel=${CHANNEL}")
          PREV_VERSION=$(echo $PREV_VERSION_JSON | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)
          
          if [ ! -z "$PREV_VERSION" ] && [ "$PREV_VERSION" != "$VERSION" ]; then
            echo "Generating delta patch from $PREV_VERSION to $VERSION..."
            PREV_BUNDLE_PATH="Aether-bundle-${PREV_VERSION}.tar.gz"
            curl -s -L -o "$PREV_BUNDLE_PATH" "https://api.hackmist.tech/api/v1/aether/download/bundle?v=${PREV_VERSION}&channel=${CHANNEL}"
            
            if [ -f "$PREV_BUNDLE_PATH" ]; then
              PATCH_FILENAME="Aether-patch-${PREV_VERSION}-to-${VERSION}.bsdiff"
              bsdiff "$PREV_BUNDLE_PATH" "$BUNDLE_PATH" "$PATCH_FILENAME"
              echo "Patch generated: $PATCH_FILENAME"
              echo "PATCH_FILENAME=$PATCH_FILENAME" >> $GITHUB_ENV
              echo "PATCH_FROM=$PREV_VERSION" >> $GITHUB_ENV
            else
              echo "Failed to download previous bundle."
            fi
          fi

          echo "Publishing version $VERSION..."

          # Upload via curl
          echo "Uploading to API..."
          CURL_CMD="curl --fail -v --max-time 300 \
            -H \"Authorization: Bearer ${{ secrets.AETHER_UPLOAD_KEY }}\" \
            -F \"file=@$DMG_PATH\" \
            -F \"bundle=@$BUNDLE_PATH\" \
            -F \"version=$VERSION\" \
            -F \"channel=$CHANNEL\" \
            -F \"description=$DESCRIPTION\" \
            -F \"changelog=$CHANGELOG\""
            
          if [ ! -z "$PATCH_FILENAME" ]; then
            CURL_CMD="$CURL_CMD -F \"patch=@$PATCH_FILENAME\" -F \"patch_from=$PATCH_FROM\""
          fi
          
          eval "$CURL_CMD https://api.hackmist.tech/api/v1/aether" \
            && echo "Upload successful!" \
            || echo "Upload failed with exit code $?"
