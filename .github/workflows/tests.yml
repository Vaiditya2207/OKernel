name: Tests

on:
  push:
    branches:
      - main
      - 'releases/**'
  pull_request:
    branches:
      - main
      - 'releases/**'

jobs:
  test-web:
    name: Web Tests (Unit & E2E)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-jammy
    env:
      HOME: /root
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm install

      # The container image already includes Playwright browsers and dependencies.
      # We skip the long-running 'npx playwright install --with-deps' step.

      - name: Run Unit Tests
        run: npm test -- --run

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          VITE_API_URL: http://localhost:3001

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

  test-syscore:
    name: SysCore Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Run Integration Tests
        run: cd syscore && cargo test
